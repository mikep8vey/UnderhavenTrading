<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Underhaven Weather</title>
<style>
:root{--bg:#f4f6f8;--panel:#ffffff;--fg:#0f172a;--mut:#64748b;--line:#e2e8f0;--accent:#0d9488;--accent2:#0f766e;
--good:#15803d;--goodbg:#dcfce7;--bad:#b91c1c;--badbg:#fee2e2;--warn:#b45309;--warnbg:#fef3c7;--gray:#475569;--graybg:#e2e8f0;--shadow:0 1px 2px rgba(15,23,42,.06),0 4px 14px rgba(15,23,42,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#0b0f14;--panel:#121820;--fg:#e5e9f0;--mut:#8b97a8;--line:#222c38;--accent:#2dd4bf;--accent2:#14b8a6;
--good:#4ade80;--goodbg:#10301c;--bad:#f87171;--badbg:#3a1616;--warn:#fbbf24;--warnbg:#3a2a0b;--gray:#a3aebd;--graybg:#222c38;--shadow:none}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lcard{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:4px}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:inline-block}
.lcard p{color:var(--mut);margin:0 0 20px}
label{display:block;font-size:12px;font-weight:600;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=password],input.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
button.primary{width:100%;margin-top:18px;padding:11px;border:0;border-radius:10px;background:var(--accent2);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button.primary:disabled{opacity:.6;cursor:wait}
.err{color:var(--bad);margin-top:12px;min-height:20px;font-size:13px}
/* app */
header{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bar .logo{margin:0}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--graybg);color:var(--gray)}
.pill.good{background:var(--goodbg);color:var(--good)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.warn{background:var(--warnbg);color:var(--warn)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.link{background:none;border:0;color:var(--mut);cursor:pointer;font:inherit}
.link:hover{color:var(--fg)}
main{max-width:1240px;margin:0 auto;padding:18px}
.banner{padding:12px 14px;border-radius:12px;margin-bottom:16px;font-weight:600}
.banner.bad{background:var(--badbg);color:var(--bad)}.banner.warn{background:var(--warnbg);color:var(--warn)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.kpi .v{font-size:23px;font-weight:700;margin-top:2px}
.kpi .s{font-size:12px;color:var(--mut);margin-top:2px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:12px;margin-bottom:16px}
@media (max-width:860px){.grid2{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.ph{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.ph h2{margin:0;font-size:13px;font-weight:700}
.pb{padding:14px 16px}
svg.chart{width:100%;height:200px;display:block}
.cityrow{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;margin:9px 0;font-size:13px}
.track{height:8px;background:var(--graybg);border-radius:99px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:99px}
.empty{color:var(--mut);padding:26px 16px;text-align:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px;align-items:center}
.tab{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--mut);cursor:pointer;font:inherit;font-weight:600}
.tab.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
.tabs input.search{width:220px;margin-left:auto;padding:7px 12px;border-radius:999px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:680px}
th{position:sticky;top:0;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);padding:9px 14px;border-bottom:1px solid var(--line);background:var(--panel);white-space:nowrap}
td{padding:9px 14px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700;background:var(--graybg);color:var(--gray)}
.badge.good{background:var(--goodbg);color:var(--good)}.badge.bad{background:var(--badbg);color:var(--bad)}.badge.warn{background:var(--warnbg);color:var(--warn)}
.foot{color:var(--mut);font-size:12px;text-align:center;margin:20px 0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}.seg button{border:0;background:var(--panel);color:var(--mut);padding:5px 14px;font:inherit;font-weight:600;cursor:pointer}.seg button.on{background:var(--accent2);color:#fff}.seg button.off{opacity:.55}
.note{color:var(--mut);font-size:12px;margin:0 0 10px}
</style>
</head>
<body>

<div id="login" hidden>
  <form class="lcard" id="lform" autocomplete="on">
    <div class="logo"><i></i>Underhaven Weather</div>
    <p>Sign in to view the trading dashboard.</p>
    <label for="u">Username</label><input type="text" id="u" name="username" autocomplete="username" required>
    <label for="p">Password</label><input type="password" id="p" name="password" autocomplete="current-password" required>
    <button class="primary" id="lbtn" type="submit">Sign in</button>
    <div class="err" id="lerr"></div>
  </form>
</div>

<div id="app" hidden>
  <header><div class="bar">
    <div class="logo"><i></i>Underhaven Weather</div>
    <span class="pill" id="pstatus"><span class="dot"></span><span id="pstatust">...</span></span>
    <span class="pill" id="pmode">-</span>
    <span class="pill" id="puptime">-</span>
    <div class="seg" id="seg"></div>
    <div class="sp"></div>
    <span class="pill" id="pupd" style="background:none;color:var(--mut);font-weight:500">-</span>
    <button class="link" id="logout">Sign out</button>
  </div></header>
  <main>
    <div class="banner" id="banner" hidden></div>
    <div class="kpis" id="kpis"></div>
    <div class="grid2">
      <div class="panel"><div class="ph"><h2>Equity</h2><span class="pill" id="eqrange">-</span></div><div class="pb"><div id="chart"></div></div></div>
      <div class="panel"><div class="ph"><h2>Exposure by city</h2></div><div class="pb" id="cities"></div></div>
    </div>
    <div class="note" id="note"></div>
    <div class="tabs" id="tabs"></div>
    <div class="panel"><div class="tw"><table id="tbl"></table></div></div>
    <div class="foot" id="foot"></div>
  </main>
</div>

<script>
const $=s=>document.querySelector(s);
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined&&x!==null)e.textContent=x;return e};
const num=x=>{const n=parseFloat(x);return isNaN(n)?null:n};
const usd=x=>{const n=num(x);return n===null?'-':n.toLocaleString(undefined,{style:'currency',currency:'USD'})};
const pct=(x,d=2)=>{const n=num(x);return n===null?'-':(n*100).toFixed(d)+'%'};
const f3=x=>{const n=num(x);return n===null?'':n.toFixed(3)};
const fdate=s=>{try{return new Date(s).toLocaleString([], {month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'})}catch(e){return s}};
const dur=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return d?d+'d '+h+'h':h?h+'h '+m+'m':m+'m'};

let D=null,tab='signals',q='',acct='paper';
const TABS={
  signals:{label:'Signals',rows:'signals',cols:['ts','city','strategy','bracket','model_prob','market_ask','edge','settlement_check','decision','reason']},
  positions:{label:'Positions',rows:'positions',cols:['city','bracket','outcome','size','avg_price','mark','cost','value']},
  orders:{label:'Orders',rows:'orders',cols:['ts','side','price','size','post_only','status','filled','fee']},
  fills:{label:'Fills',rows:'fills',cols:['ts','order_id','price','size','is_maker']},
  events:{label:'Events',rows:'events',cols:['ts','level','kind','message']},
  calibration:{label:'Calibration',rows:'calib_rows',cols:['range','n','predicted','observed','gap']}
};
const NUMC=new Set(['model_prob','market_ask','edge','size','avg_price','mark','cost','value','price','filled','fee']);

function badge(text,kind){return el('span','badge '+(kind||''),text)}
function cell(col,v,row){
  const td=el('td');
  if(col==='ts'){td.textContent=fdate(v);td.className='num';return td}
  if(col==='decision'){td.appendChild(badge(v,v==='TRADE'?'good':''));return td}
  if(col==='level'){td.appendChild(badge(v,v==='WARN'?'warn':''));return td}
  if(col==='settlement_check'){
    const s=String(v||'');
    if(s==='PASS')td.appendChild(badge('PASS','good'));
    else if(s.startsWith('SETTLEMENT_UNSAFE')){const b=badge('UNSAFE','bad');b.title=s;td.appendChild(b)}
    else if(s==='PROVISIONALLY_DEAD')td.appendChild(badge('DEAD','warn'));
    else td.textContent=s==='n/a'?'':s;
    return td}
  if(col==='post_only'||col==='is_maker'){td.appendChild(badge(v?(col==='is_maker'?'maker':'post-only'):(col==='is_maker'?'taker':'taker'),v?'good':'warn'));return td}
  if(col==='status'&&row.pnl===undefined){td.appendChild(badge(v,v==='filled'?'good':v==='rejected'?'bad':''));return td}
  if(NUMC.has(col)){td.className='num';td.textContent=['market_ask','model_prob','edge'].includes(col)?f3(v):(v===null?'':v);return td}
  td.textContent=v===null||v===undefined?'':v;
  if(col==='reason'||col==='message')td.title=td.textContent;
  return td}

function renderTable(){
  const t=TABS[tab],tbl=$('#tbl');tbl.replaceChildren();
  let rows=(D[t.rows]||[]);
  if(q){const k=q.toLowerCase();rows=rows.filter(r=>JSON.stringify(r).toLowerCase().includes(k))}
  const hr=el('tr');t.cols.forEach(c=>hr.appendChild(el('th','',c.replace(/_/g,' '))));
  const th=el('thead');th.appendChild(hr);tbl.appendChild(th);
  const tb=el('tbody');
  rows.forEach(r=>{const tr=el('tr');t.cols.forEach(c=>tr.appendChild(cell(c,r[c],r)));tb.appendChild(tr)});
  tbl.appendChild(tb);
  if(!rows.length){const e=el('div','empty',q?'No rows match your search.':'Nothing here yet.');tbl.after(e);e.dataset.tmp='1'}
}
function renderTabs(){
  const box=$('#tabs');box.replaceChildren();
  Object.keys(TABS).forEach(k=>{
    const n=(D[TABS[k].rows]||[]).length;
    const b=el('button','tab'+(k===tab?' on':''),TABS[k].label+' ('+n+')');
    b.onclick=()=>{tab=k;draw()};box.appendChild(b)});
  const s=el('input','search');s.placeholder='Filter rows...';s.value=q;s.type='text';
  s.oninput=()=>{q=s.value;document.querySelectorAll('[data-tmp]').forEach(e=>e.remove());renderTable()};
  box.appendChild(s);
}
function kpi(l,v,s,cls){const d=el('div','kpi');d.appendChild(el('div','l',l));d.appendChild(el('div','v num '+(cls||''),v));if(s)d.appendChild(el('div','s',s));return d}
function renderKpis(){
  const eq=num(D.equity),bk=num(D.bankroll),pnl=eq-bk,dd=num(D.drawdown),lim=num(D.drawdown_limit);
  const used=num(D.exposure_total),cap=num(D.exposure_cap);
  const k=$('#kpis');k.replaceChildren();
  k.appendChild(kpi('Equity',usd(eq),'Bankroll '+usd(bk)));
  k.appendChild(kpi('P&L vs bankroll',(pnl>=0?'+':'')+usd(pnl),bk?((pnl/bk*100).toFixed(2)+'%'):'',pnl>=0?'pos':'neg'));
  k.appendChild(kpi('Drawdown',pct(dd),'Kill switch at '+pct(lim,0)+', daily cap '+pct(D.daily_loss_cap,0),dd>=lim*0.6?'neg':''));
  k.appendChild(kpi('Cash',usd(D.cash)));
  k.appendChild(kpi('Exposure',usd(used),cap?((used/cap*100).toFixed(0)+'% of '+usd(cap)+' cap'):''));
  k.appendChild(kpi('Open positions',String((D.positions||[]).length),D.counts.orders+' orders, '+D.counts.fills+' fills'));
  k.appendChild(kpi('Maker volume',usd(D.maker_volume),'Est. rebate '+usd(D.accrued_rebate)));
  k.appendChild(kpi('Signals',String(D.counts.signals_trade),D.counts.signals_skip+' skipped (stored)'));
}
function renderChart(){
  const h=(D.equity_history||[]).map(p=>({t:new Date(p.ts).getTime(),v:num(p.equity)})).filter(p=>p.v!==null);
  h.push({t:Date.now(),v:num(D.equity)});
  const box=$('#chart');box.replaceChildren();
  if(h.length<3){box.appendChild(el('div','empty','Collecting data... a point is stored every 5 minutes.'));$('#eqrange').textContent='-';return}
  const W=640,H=200,P=8;
  const xs=h.map(p=>p.t),ys=h.map(p=>p.v);
  const x0=Math.min(...xs),x1=Math.max(...xs),lo=Math.min(...ys),hi=Math.max(...ys),span=(hi-lo)||1;
  const X=t=>P+(t-x0)/((x1-x0)||1)*(W-2*P),Y=v=>H-P-(v-lo)/span*(H-2*P-14)-7;
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 '+W+' '+H);svg.setAttribute('class','chart');svg.setAttribute('preserveAspectRatio','none');
  const pts=h.map(p=>X(p.t).toFixed(1)+','+Y(p.v).toFixed(1)).join(' ');
  const defs=document.createElementNS(NS,'defs');
  defs.innerHTML='<linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d9488" stop-opacity=".28"/><stop offset="1" stop-color="#0d9488" stop-opacity="0"/></linearGradient>';
  svg.appendChild(defs);
  const area=document.createElementNS(NS,'polygon');area.setAttribute('points',pts+' '+X(x1).toFixed(1)+','+H+' '+X(x0).toFixed(1)+','+H);area.setAttribute('fill','url(#g)');svg.appendChild(area);
  const line=document.createElementNS(NS,'polyline');line.setAttribute('points',pts);line.setAttribute('fill','none');line.setAttribute('stroke','#0d9488');line.setAttribute('stroke-width','2');line.setAttribute('vector-effect','non-scaling-stroke');svg.appendChild(line);
  box.appendChild(svg);
  $('#eqrange').textContent=usd(lo)+' - '+usd(hi);
}
function renderCities(){
  const box=$('#cities');box.replaceChildren();
  const rows=(D.by_city||[]).map(r=>({c:r.city,v:num(r.cost)})).sort((a,b)=>b.v-a.v);
  if(!rows.length){box.appendChild(el('div','empty','No open positions.'));return}
  const mx=Math.max(...rows.map(r=>r.v))||1;
  rows.forEach(r=>{const row=el('div','cityrow');row.appendChild(el('div','',r.c));
    const tr=el('div','track'),f=el('div','fill');f.style.width=(r.v/mx*100)+'%';tr.appendChild(f);row.appendChild(tr);
    row.appendChild(el('div','num',usd(r.v)));box.appendChild(row)});
}
function renderHeader(){
  const st=$('#pstatus'),stt=$('#pstatust'),ban=$('#banner');
  ban.hidden=true;ban.className='banner';
  if(D.permanent_halt){st.className='pill bad';stt.textContent='Kill switch';ban.hidden=false;ban.className='banner bad';ban.textContent='Drawdown kill switch tripped: '+D.halt_reason+'. Trading on this account is stopped until you review and delete the KILL_SWITCH_'+acct+' file.'}
  else if(D.halted){st.className='pill warn';stt.textContent='Paused';ban.hidden=false;ban.className='banner warn';ban.textContent='Trading paused by a safety guard: '+D.halt_reason}
  else{st.className='pill good';stt.textContent='Running'}
  const m=$('#pmode');m.textContent=D.mode==='live'?'LIVE':'PAPER';m.className='pill '+(D.mode==='live'?'bad':'');
  $('#puptime').textContent='Up '+dur(D.uptime_secs);
  $('#pupd').textContent='Updated '+new Date().toLocaleTimeString();
  $('#foot').textContent='weather-bot v'+D.version+' - read-only dashboard - refreshes every 10s';
}
function renderSeg(){
  const box=$('#seg');box.replaceChildren();
  (D.accounts||[]).forEach(a=>{
    const b=el('button',(a.name===acct?'on':'')+(a.enabled?'':' off'),(a.name==='paper'?'Paper':'Live')+(a.enabled?' \u00b7 '+usd(a.equity):' \u00b7 off'));
    b.onclick=()=>{acct=a.name;tab='signals';refresh()};box.appendChild(b)});
}
function renderNote(){
  const c=D.calibration||{};const n=$('#note');
  if(tab==='calibration'){
    const s=c.scores||{};const f2=x=>(x===null||x===undefined||!s.n)?'-':x.toFixed(3);
    const verdict=!s.n?'':(s.model<s.market?' Model beats the market so far.':' Model is WORSE than the market so far, so the bot leans on the market price.');
    n.textContent='Brier (lower is better) - model '+f2(s.model)+', market '+f2(s.market)+', blended '+f2(s.blend)+' on '+(s.n||0)+' settled forecasts.'+verdict+' | Settled forecasts: '+c.settled+' (calibration '+(c.active?'ACTIVE':'inactive until '+c.min_samples+' have settled')+'). Brier score of raw forecasts: '+((c.brier===null||c.brier===undefined)?'-':c.brier.toFixed(3))+' (0.25 = coin flip). Predicted vs observed YES frequency per bucket. The bot also blends the model with the market price (model weight '+c.shrink_weight+').';
  }else{
    n.textContent=acct==='live'?'Live account: real orders, its own positions and P&L. Same signals, edge and probabilities as paper; sized from the live bankroll.':'Paper account: simulated fills on real order books. Same signals, edge and probabilities as live.';
  }
}
function draw(){
  document.querySelectorAll('[data-tmp]').forEach(e=>e.remove());
  renderSeg();
  if(D.enabled===false){
    ['#kpis','#chart','#cities','#tbl','#tabs'].forEach(s=>$(s).replaceChildren());
    const b=$('#banner');b.hidden=false;b.className='banner warn';
    b.textContent='Live trading is not enabled. Put your keys in /etc/weather-bot/env, set live_bankroll_usdc in risk.toml and run the service with "weather-bot live --enable" (see BUILD.md). Paper keeps running meanwhile.';
    $('#note').textContent='';return}
  renderHeader();renderKpis();renderChart();renderCities();renderTabs();renderTable();renderNote();
}
async function refresh(){
  const r=await fetch('/api/summary?account='+acct,{cache:'no-store',credentials:'same-origin'});
  if(r.status===401){showLogin();return false}
  D=await r.json();$('#login').hidden=true;$('#app').hidden=false;draw();return true;
}
function showLogin(){$('#app').hidden=true;$('#login').hidden=false;$('#p').value=''}
$('#lform').addEventListener('submit',async e=>{
  e.preventDefault();const b=$('#lbtn'),er=$('#lerr');er.textContent='';b.disabled=true;
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({user:$('#u').value,password:$('#p').value})});
    if(r.ok){await refresh()}else{const j=await r.json().catch(()=>({}));er.textContent=j.error||'Sign in failed.'}
  }catch(x){er.textContent='Cannot reach the server.'}
  b.disabled=false});
$('#logout').onclick=async()=>{await fetch('/api/logout',{method:'POST',credentials:'same-origin'});showLogin()};
refresh().catch(()=>showLogin());
setInterval(()=>{if(!$('#app').hidden)refresh().catch(()=>{})},10000);
</script>
</body>
</html>
