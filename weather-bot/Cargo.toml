[package]
name = "weather-bot"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Polymarket weather trading bot: forecast edge + late-day NO harvester, maker-first execution"

[lib]
name = "weather_bot"
path = "src/lib.rs"

[[bin]]
name = "weather-bot"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rust_decimal = { version = "1", features = ["serde-with-float"] }
rust_decimal_macros = "1"
chrono = "0.4"
chrono-tz = { version = "0.9", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
dotenvy = "0.15"
hmac = "0.12"
sha2 = "0.10"
sha3 = "0.10"
base64 = "0.22"
k256 = { version = "0.13", features = ["ecdsa"] }
hex = "0.4"
rand = "0.8"
regex = "1"
once_cell = "1"
async-trait = "0.1"
csv = "1"

[profile.release]
opt-level = 3
lto = "thin"
