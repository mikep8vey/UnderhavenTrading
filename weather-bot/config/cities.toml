# Per-city metadata (kept separate so stations.toml stays an exact copy of the registry).
# tz        : IANA timezone of the station
# unit      : unit the Polymarket brackets are quoted in
# day_basis : "lst"   = NWS climatological day (local STANDARD time all year, i.e. 1am-1am during DST)
#             "local" = civil local calendar day
# station_names : extra spellings accepted when matching the market rules text
# decoys    : other airports/stations; if the rules text mentions one, the market goes to MANUAL_REVIEW

[[city]]
name = "New York"
aliases = ["new york city", "new york", "nyc"]
tz = "America/New_York"
unit = "F"
day_basis = "lst"
station_names = ["LaGuardia", "La Guardia"]
decoys = ["JFK", "Kennedy", "Newark", "Central Park", "KNYC", "KJFK", "KEWR"]

