# All limits live here and are enforced in src/risk/. Write every number with a decimal point.

bankroll_usdc = 1000.0            # sizing base for paper mode; live uses the same number (set it to what you fund)
drawdown_kill_pct = 0.15          # permanent kill switch (writes KILL_SWITCH file next to the DB)
max_event_pct = 0.08              # max capital per event
max_total_exposure_pct = 0.25     # max total weather exposure
max_positions_per_city = 3
daily_loss_cap_pct = 0.05         # per account: no new trades for the rest of the UTC day after a 5% loss since day start
max_attempts_per_market = 3       # per account, market and UTC day: stop retrying after this many unfilled attempts
retry_cooldown_secs = 900         # minimum wait between attempts on the same market
live_bankroll_usdc = 0.0          # REQUIRED for live trading: the USDC you actually fund (sizing base for the live account)

[forecast]
kelly_mult = 0.25
cap_pct = 0.05
min_edge = 0.08                   # P_model - ask - taker_fee(ask) must exceed this
taker_min_edge = 0.10             # taker fallback only if taker_edge exceeds this
max_spread = 0.03                 # strictly less than
min_shares = 5.0                  # Polymarket minimum order size
maker_timeout_secs = 60
cutoff_hour_local = 15            # day-of markets are only traded before this local hour
scan_interval_secs = 300
ensemble_ttl_secs = 900
shrink_weight = 0.3               # p = w*calibrated_model + (1-w)*market_yes_mid ; 1.0 = trust the model fully
calibration_min_samples = 100     # calibration is identity until this many settled forecasts are logged
calibration_prior = 20.0          # pseudo-observations pulling each bucket toward the raw probability
no_max_yes_mid = 0.30             # favourite guard: no NO-buys on brackets the market prices above this YES probability (1.0 = off)
min_entry_price = 0.05            # skip lottery-ticket entries priced below this

[harvester]
kelly_mult = 0.15
cap_pct = 0.08
min_ask = 0.70
max_ask = 0.99
floor_ask = 0.10                  # skip below this (adverse selection)
max_spread = 0.03
taker_min_ask = 0.85
model_prob = 0.98                 # P(NO wins) assigned once a bracket passes the settlement-safety check
min_shares = 5.0
maker_timeout_secs = 45
start_hour_local = 13             # afternoon/evening only
poll_secs = 30
settle_tolerance = 0.5            # |CLI extreme - METAR extreme| must be <= this (market units)
boundary_margin = 0.5             # bracket boundary must be at least this far from the running extreme
cli_ttl_secs = 3600

[execution]
depth_multiple = 3.0
reprice_threshold = 0.01
reprice_secs = 10
max_quote_age_secs = 15
poll_secs = 2

[guards]
crypto_vol_threshold = 0.015      # 1-minute candle range / open
crypto_url = "https://api.exchange.coinbase.com/products"
crypto_symbols = ["BTC-USD", "ETH-USD", "XRP-USD"]
metar_swing_c = 2.0
metar_swing_window_mins = 15
pause_secs = 300
check_secs = 20

[ensemble]
# Open-Meteo ensemble model ids: ECMWF IFS, ECMWF AIFS, NCEP GEFS, ICON. Verify names against their docs.
models = ["ecmwf_ifs025", "ecmwf_aifs025", "gfs025", "icon_seamless"]

[endpoints]
gamma_url = "https://gamma-api.polymarket.com"
clob_url = "https://clob.polymarket.com"
metar_url = "https://aviationweather.gov/api/data/metar"
cli_url = "https://mesonet2.agron.iastate.edu/cgi-bin/afos/retrieve.py"
ensemble_url = "https://ensemble-api.open-meteo.com/v1/ensemble"
chain_id = 137
exchange = "0x4bFb41d5B3570DeFd03C39a9A4D8dE6Bd8B8982E"
neg_risk_exchange = "0xC5d563A36AE78145C45a50134d48A1215220f80a"

[dashboard]
enabled = true
bind = "127.0.0.1:8787"   # keep on loopback; nginx terminates HTTPS in front of it
