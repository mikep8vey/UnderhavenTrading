# Settlement stations. The station a market settles on is NOT always the city's
# main airport. The bot parses each market's rules text and cross-checks it
# against this table; on disagreement it logs MANUAL_REVIEW_REQUIRED and does not trade.
# Never use city-center coordinates; these are airport coordinates.

