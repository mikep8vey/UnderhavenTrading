# Initial HTTP-only vhost used only to obtain the Let's Encrypt certificate.
# The installer replaces this with nginx-underhaven.conf (or the self-signed
# variant) after issuance.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
