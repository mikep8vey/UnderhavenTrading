# UNDERHAVEN reverse proxy (SELF-SIGNED FALLBACK).
#
# This certificate is NOT publicly trusted. Browsers will show a warning until
# an operator installs a trust exception. The dashboard labels this mode as
# "TLS self-signed". Use this only when Let's Encrypt IP issuance cannot work.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/underhaven/tls/selfsigned.crt;
    ssl_certificate_key /etc/underhaven/tls/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 128k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite rather than append: this is the only trusted proxy.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /api/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
