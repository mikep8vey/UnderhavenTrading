# UNDERHAVEN reverse proxy (Let's Encrypt short-lived IP certificate).
# Certificates are installed by deploy/acme-shortlived.sh at these paths.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` on the listen line is accepted by nginx 1.18 (Ubuntu 22.04) and
    # still works on 1.24+ (where it prints a deprecation notice).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/underhaven/tls/fullchain.pem;
    ssl_certificate_key /etc/underhaven/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 128k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite rather than append: this is the only trusted proxy, so an
    # attacker-supplied X-Forwarded-For must never reach the application.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # SSE: no buffering, long read timeout.
    location = /api/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }
}
