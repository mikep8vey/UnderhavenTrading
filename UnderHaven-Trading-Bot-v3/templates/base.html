<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UnderHaven Trading Bot</title><link rel="icon" href="/static/favicon.png">
<style>
:root{--bg:#050914;--panel:#0b1222;--panel2:#0f1930;--line:#20304f;--text:#edf4ff;--muted:#91a4c3;--blue:#4b8cff;--cyan:#29d3ff;--green:#39e6a2;--yellow:#ffd166;--red:#ff5f78;--shadow:0 16px 40px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:radial-gradient(circle at 15% 0%,#10254a 0,transparent 34%),radial-gradient(circle at 90% 10%,#132b3b 0,transparent 30%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1500px;margin:auto;padding:18px 22px 30px}.top{display:flex;align-items:center;gap:14px;padding:8px 0 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(5,9,20,.88);backdrop-filter:blur(14px);z-index:20}.top img{width:52px;height:52px;border-radius:14px;box-shadow:0 8px 28px rgba(41,211,255,.16)}.brand{font-weight:900;font-size:20px;letter-spacing:.7px}.muted{color:var(--muted)}.small{font-size:12px;line-height:1.45}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all}.dashboard{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,.8fr);gap:14px;margin-top:14px}.left,.right{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-content:start;min-width:0}.left>*,.right>*{min-width:0}.card{min-width:0;background:linear-gradient(180deg,rgba(15,25,48,.96),rgba(8,15,29,.96));border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}.hero{padding:18px;background:linear-gradient(135deg,rgba(20,45,79,.96),rgba(9,18,34,.98))}.hero-title{font-size:26px;font-weight:900}.hero-sub{margin-top:3px;color:#b9c8df}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.top-actions{margin-left:auto;display:flex;gap:8px}.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border:1px solid #294164;border-radius:999px;background:#0a1427;font-size:11px;font-weight:800;letter-spacing:.3px}.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);box-shadow:0 0 10px currentColor}.dot.green{background:var(--green)}.dot.yellow{background:var(--yellow)}.dot.red{background:var(--red)}.mode-toggle{display:inline-flex;background:#060c18;border:1px solid #304766;border-radius:11px;padding:3px}.mode-toggle button{border:0;background:transparent;color:#8ea2c0;padding:8px 12px;border-radius:8px;font-weight:800;cursor:pointer}.mode-toggle button.active{background:#19335d;color:#fff;box-shadow:inset 0 0 0 1px #3c75bd}.btn{background:linear-gradient(135deg,#2e78ff,#3d9cff);color:white;border:0;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:750;box-shadow:0 7px 20px rgba(54,128,255,.18)}.btn.gray{background:#18263e;box-shadow:none}.btn.red{background:#a82e49}.btn.green{background:#13865f}.btn.smallbtn{padding:7px 10px;font-size:12px}.input{background:#070f1e;color:white;border:1px solid #2a4164;border-radius:8px;padding:9px;width:100%;outline:none}.input:focus{border-color:#4a8dff;box-shadow:0 0 0 3px rgba(74,141,255,.1)}label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#091326;border:1px solid #1d3150;border-radius:12px;padding:12px}.stat{min-width:0}.stat .value{font-size:21px;font-weight:900;margin-top:5px;overflow-wrap:anywhere}.ok{color:var(--green)}.warn{color:var(--yellow)}.bad{color:var(--red)}.section-title{font-size:14px;font-weight:900;letter-spacing:.25px;margin:0 0 11px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:6px 10px;margin-bottom:10px;flex-wrap:wrap}.chart{height:210px;border:1px solid #1d3150;border-radius:12px;background:#07101f;overflow:hidden}.chart svg{width:100%;height:100%;display:block}.legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:8px}.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:8px;height:8px;border-radius:50%;background:var(--cyan)}.legend i.green{background:var(--green)}.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}.settings-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px}.table-wrap{overflow:auto;max-height:420px;border:1px solid #1b2d49;border-radius:11px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:8px 9px;border-bottom:1px solid #172844;text-align:left;font-size:12px;white-space:nowrap}th{position:sticky;top:0;background:#0b1629;color:#9fb2d0;z-index:2}.flash{padding:11px;background:#10213b;border:1px solid #29466e;border-radius:10px;margin:10px 0}.danger{border-color:#7e2f43}.balance{font-size:25px;font-weight:900}.connection-box{background:#07101f;border:1px solid #1c3150;border-radius:12px;padding:12px}.stack{display:grid;gap:9px}.note{padding:9px 10px;border-radius:9px;background:#0a1629;border:1px solid #1b3151;color:#9fb2cf;font-size:11px;line-height:1.45}.footer-note{font-size:10px;color:#7185a5;margin-top:8px}.spacer{height:2px}@media(max-width:1280px){.dashboard{grid-template-columns:minmax(0,1fr)}.stats{grid-template-columns:repeat(4,1fr)}}@media(max-width:700px){.wrap{padding:12px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:minmax(0,1fr)}.top{position:static;flex-wrap:wrap}.top-actions{margin-left:0}.hero-title{font-size:21px}.card{padding:13px}.mode-toggle{flex-shrink:0}}
</style></head><body><div class="wrap">{% with messages=get_flashed_messages() %}{% for m in messages %}<div class="flash">{{m}}</div>{% endfor %}{% endwith %}{% block body %}{% endblock %}</div></body></html>
