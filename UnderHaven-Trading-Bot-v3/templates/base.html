body{margin:0;background:#071022;color:#eaf2ff;font-family:Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:24px}.top{display:flex;align-items:center;gap:14px;border-bottom:1px solid #203152;padding-bottom:18px}.top img{width:58px;height:58px;border-radius:14px}.brand{font-weight:800;font-size:22px}.muted{color:#9db0cf}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:#0d1930;border:1px solid #203152;border-radius:14px;padding:16px;margin:14px 0}.big{font-size:25px;font-weight:800}.ok{color:#41e59b}.warn{color:#ffd166}.bad{color:#ff6b7a}.btn{background:#1d6dff;color:white;border:0;border-radius:9px;padding:10px 14px;cursor:pointer}.btn.red{background:#b9324b}.btn.gray{background:#263752}.input{background:#081226;color:white;border:1px solid #2b4268;border-radius:8px;padding:10px;width:100%;box-sizing:border-box}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #203152;text-align:left;font-size:13px}.flash{padding:12px;background:#162845;border-radius:9px;margin:10px 0}.pill{padding:5px 9px;border-radius:999px;background:#182943}.danger{border-color:#8c3145}.small{font-size:12px}.mono{font-family:monospace;word-break:break-all}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
